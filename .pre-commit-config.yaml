# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: local
    hooks:
    -   id: spdx-license-id
        name: spdx-license-id
        entry: sh ./spdxcheck.sh
        language: system
        pass_filenames: false

    -   id: black
        name: black
        entry: black
        language: system
        types:
        -   python
        files: ^(topotato|selftests)/.*\.py$

    -   id: pylint
        name: pylint
        entry: pylint --persistent=n --score=n --disable=fixme --source-roots=.
        language: system
        types:
        -   python
        files: ^(topotato|selftests)/.*\.py$

    -   id: mypy
        name: mypy
        entry: mypy -p topotato
        language: system
        types:
        -   python
        require_serial: true
        pass_filenames: false
        files: ^topotato/.*\.py$

    -   id: mypy
        name: mypy_selftests
        entry: mypy selftests/
        language: system
        types:
        -   python
        require_serial: true
        pass_filenames: false
        files: ^selftests/.*\.py$

    -   id: pyrefly
        name: pyrefly
        entry: pyrefly check topotato selftests
        language: system
        types:
        -   python
        pass_filenames: false
        files: ^(topotato|selftests)/.*\.py$
